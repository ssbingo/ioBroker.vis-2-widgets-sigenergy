# Automatically merge Dependabot PRs when version comparison is within the range
# that is configured in .github/auto-merge.yml

name: Auto-Merge Dependabot PRs

on:
  # WARNING: This needs to be run in the PR base, DO NOT build untrusted code in this action
  # details under https://github.blog/changelog/2021-02-19-github-actions-workflows-triggered-by-dependabot-prs-will-run-with-read-only-permissions/
  pull_request_target:

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Check if PR should be auto-merged
        uses: iobroker-bot-orga/action-automerge-dependabot@v1
        with:
          # Uses the repository secret AUTO_MERGE_TOKEN (a Personal Access Token with
          # "public_repo" permission) if it exists, otherwise falls back to GITHUB_TOKEN.
          # Note: merges done with GITHUB_TOKEN do not trigger further workflow runs.
          github-token: ${{ secrets.AUTO_MERGE_TOKEN || secrets.GITHUB_TOKEN }}
          # By default, squash and merge, so Github chooses nice commit messages
          merge-method: squash
