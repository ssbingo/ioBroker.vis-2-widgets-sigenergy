name: Test and Release

# Run this job on all pushes and pull requests
# as well as tags with a semantic version
on:
  push:
    branches:
      - "main"
    tags:
      # normal versions
      - "v[0-9]+.[0-9]+.[0-9]+"
      # pre-releases
      - "v[0-9]+.[0-9]+.[0-9]+-**"
  pull_request: {}

# Cancel previous PR/branch runs when a new commit is pushed
concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Performs quick checks before the expensive test runs
  check-and-lint:
    if: contains(github.event.head_commit.message, '[skip ci]') == false

    runs-on: ubuntu-latest

    steps:
      - uses: ioBroker/testing-action-check@v2
        with:
          node-version: '24.x'
          lint: true
          install-command: 'npm install'

  # Runs the package tests on all supported Node.js versions
  adapter-tests:
    needs: [check-and-lint]
    if: contains(github.event.head_commit.message, '[skip ci]') == false
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x, 24.x, 26.x]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      # npm 11.x bundled with Node.js 22.22.x is missing promise-retry from its
      # bundled deps, which breaks any npm operation that triggers arborist/rebuild.
      # Workaround (replacing npm with npm@10.9.2) for Node 22.x only.
      - name: Replace broken npm with npm@10 (Node 22.x only)
        if: matrix.node-version == '22.x'
        run: |
          NPM_GLOBAL="$(dirname $(dirname $(which npm)))/lib/node_modules/npm"
          rm -rf "$NPM_GLOBAL" && mkdir -p "$NPM_GLOBAL"
          curl -fsSL "https://registry.npmjs.org/npm/-/npm-10.9.2.tgz" \
            | tar xz --strip-components=1 -C "$NPM_GLOBAL"
          echo "npm version: $(npm --version)"
      - run: npm install
      - run: npm test

  # Deploys the final package to NPM
  deploy:
    needs: [check-and-lint, adapter-tests]

    # Trigger this step only when a commit on any branch is tagged with a version number
    if: |
      contains(github.event.head_commit.message, '[skip ci]') == false &&
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v')

    runs-on: ubuntu-latest

    # Write permissions are required to create Github releases
    permissions:
      id-token: write
      contents: write

    steps:
      - uses: ioBroker/testing-action-deploy@v1
        with:
          node-version: '24.x'
          install-command: 'npm install'
          github-token: ${{ secrets.GITHUB_TOKEN }}
